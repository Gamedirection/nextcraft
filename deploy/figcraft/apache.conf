# Apache (e.g. the official nextcloud:apache image: mount as /etc/apache2/conf-enabled/nextcraft-live.conf)
# Forwards wss://<nextcloud>/nextcraft-live/ to figcraft-server.
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module /usr/lib/apache2/modules/mod_proxy_wstunnel.so
ProxyTimeout 120
ProxyPass /nextcraft-live/ ws://figcraft-server:47900/nextcraft-live/ upgrade=websocket
ProxyPassReverse /nextcraft-live/ http://figcraft-server:47900/nextcraft-live/
